[project]
name = "baillarger"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
extend-exclude = [".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
exclude = ["^\\.worktrees/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.affected-tests]
# Claude Code hooks: no Python test depends on them.
ignore = [".claude/hooks/**"]
