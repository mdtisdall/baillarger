[project]
name = "baillarger"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nibabel>=5.4.2",
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "pyamg>=5.3.0",
    "scikit-fmm>=2025.6.23",
    "scipy>=1.18.1",
    "thinqpbo>=0.1.5",
]

[dependency-groups]
dev = [
  "matplotlib>=3.11.2",
  "mypy",
  "ortools>=9.15.6755",
  "pytest",
  "ruff",
  "scikit-image>=0.26.0",
  "scikit-learn>=1.9.1",
  "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
# prototypes/: research scripts, kept as written and not linted (their own tests run in CI)
extend-exclude = [".worktrees", "prototypes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
exclude = ["^\\.worktrees/"]
# scikit-image and nibabel ship py.typed but leave some functions unannotated
# (nibabel: Nifti1Header.get_zooms); numba internals (numba.core.cgutils) are
# unannotated too.
untyped_calls_exclude = ["skimage", "nibabel", "numba"]

# numba, llvmlite, pyamg, scikit-fmm, scikit-learn and thinqpbo have no type stubs.
# baillarger._jit gives njit a typed signature; baillarger.surfcut._thinqpbo
# gives thinqpbo's graph a typed protocol.
[[tool.mypy.overrides]]
module = ["numba", "numba.*", "llvmlite", "llvmlite.*", "pyamg", "pyamg.*", "skfmm", "skfmm.*",
  "sklearn", "sklearn.*", "thinqpbo", "thinqpbo.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# prototypes/scripts: not test_curv.py (a script, not pytest)
testpaths = [
  "tests",
  "prototypes/scripts/test_crossing_lib.py",
  "prototypes/scripts/test_edit_priority.py",
  "prototypes/scripts/test_edit_resolve.py",
  "prototypes/scripts/test_fold_phantoms.py",
  "prototypes/scripts/test_joint_levels.py",
  "prototypes/scripts/test_levelset_fill.py",
  "prototypes/scripts/test_mesh_smoothing.py",
  "prototypes/scripts/test_onepass_lib.py",
  "prototypes/scripts/test_pia_editor.py",
  "prototypes/scripts/test_pia_lib.py",
  "prototypes/scripts/test_pial_height.py",
  "prototypes/scripts/test_pial_solver.py",
  "prototypes/scripts/test_warp_cut.py",
  "prototypes/scripts/test_warp_qpbo.py",
]

[tool.affected-tests]
# Claude Code hooks: no Python test depends on them.
ignore = [".claude/hooks/**"]
# the prototype tests import their modules from prototypes/scripts
source-roots = ["src", "prototypes/scripts"]
